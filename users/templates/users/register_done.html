{% extends 'base.html' %}

{% block title %}Регистрация завершена{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h3 class="text-center mb-0">Регистрация завершена!</h3>
            </div>
            <div class="card-body text-center">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                <h4 class="mt-3">Спасибо за регистрацию!</h4>
                <p>Ваш аккаунт успешно создан. Теперь вы можете войти в систему.</p>
                <a href="{% url 'users:login' %}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right"></i> Войти
                </a>
                <a href="{% url 'pages:home' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-house"></i> На главную
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
