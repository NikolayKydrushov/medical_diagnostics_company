[tool.poetry]
name = "medical-diagnostics-company"
version = "0.1.0"
description = "Сайт для компании медицинской диагностики"
authors = ["Nikolay Kydrushov <nnikolay2909@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
django = "^6.0.2"
psycopg2-binary = "^2.9.11"
pillow = "^12.1.1"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
flake8 = "^7.3.0"
black = "^26.1.0"
isort = "^8.0.1"
mypy = "^1.19.1"
pytest-django = "^4.12.0"
model-bakery = "^1.23.3"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
addopts = "--cov=. --cov-report=html --cov-report=term"

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [
    ".venv",
    "venv",
    "env",
    "migrations",
]